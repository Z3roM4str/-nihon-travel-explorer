<!doctype html>
<meta charset="utf-8">
<title>Native Web Storage conservation reproducer</title>
<h1>Native localStorage, without Nihon</h1>
<p>Use a new, ordinary browser profile. This page never seeds storage automatically.
The confirmation means setItem returned and getItem agreed; it does not claim disk synchronization.</p>
<button id="a">1. Write checkpoint A</button>
<button id="b">2. Write interest B</button>
<button id="read">Read only</button>
<button onclick="location.reload()">Reload</button>
<button id="export">Export observations</button>
<pre id="status"></pre>
<script>
const key = 'nihon.travellers.v1';
const uuid = () => typeof crypto.randomUUID === 'function' ? crypto.randomUUID()
  : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
const documentId = uuid(), events = [];
function read() {
  const record = { at: Date.now(), documentId, origin: location.origin,
    userAgent: navigator.userAgent, raw: localStorage.getItem(key) };
  events.push(record); document.querySelector('#status').textContent = JSON.stringify(record, null, 2);
  return record;
}
function write(interest) {
  const previous = localStorage.getItem(key);
  // A fresh synthetic profile only. Refuse existing application data.
  if (previous && !JSON.parse(previous).syntheticDurabilityRepro) throw Error('Existing data: use a NEW profile');
  const id = previous ? JSON.parse(previous).travellers[0].id : uuid();
  const raw = JSON.stringify({ version: 1, syntheticDurabilityRepro: true,
    travellers: [{ id, label: 'Synthetic' }], activeTravellerId: id,
    interests: interest ? [{ placeId: 'JP-044', stances: [{ travellerId: id, stance: 'interested' }], carriedOver: false }] : [],
    _w: interest ? [id + '-A', id + '-B'] : [id + '-A'] });
  const calledAt = Date.now(); localStorage.setItem(key, raw);
  const returnedAt = Date.now(), result = read();
  events.push({ kind: 'setItem-returned', calledAt, returnedAt, raw, matched: result.raw === raw });
  return { calledAt, returnedAt, raw, result };
}
document.querySelector('#a').onclick = () => write(false);
document.querySelector('#b').onclick = () => write(true);
document.querySelector('#read').onclick = read;
document.querySelector('#export').onclick = () => {
  const a = document.createElement('a'); a.download = 'native-webstorage-observations.json';
  a.href = URL.createObjectURL(new Blob([JSON.stringify(events, null, 2)], { type: 'application/json' })); a.click();
};
read();
</script>
