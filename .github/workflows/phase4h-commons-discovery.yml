name: Phase 4H Commons discovery

on:
  push:
    branches:
      - feat/phase-4h-a-grade-photography-batch-ii
    paths:
      - scripts/discover-phase4h-commons.py
      - .github/workflows/phase4h-commons-discovery.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout discovery head
        uses: actions/checkout@v4
        with:
          ref: 2df1c6d339e505304fb04ba4bac35201f12931c7
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify selector fixture unchanged
        run: |
          python scripts/select-a-grade-photography-batch-ii.py --out /tmp/selector.json
          cmp /tmp/selector.json data/visual/a-grade-photography-batch-ii.json
          python scripts/test_a_grade_photography_selector_ii.py

      - name: Discover Commons review candidates
        run: |
          python scripts/discover-phase4h-commons.py             --out phase4h-commons-review             --per-target 8

      - name: Discovery report invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("phase4h-commons-review/report.json").read_text())
          assert report["targetCount"] == 32
          assert len(report["targets"]) == 32
          ids=[t["placeId"] for t in report["targets"]]
          pinned=json.loads(Path("data/visual/a-grade-photography-batch-ii.json").read_text())
          assert ids == [t["placeId"] for t in pinned["places"]]
          print("targets:", len(ids))
          print("targets with >=1 candidate:", sum(bool(t["candidates"]) for t in report["targets"]))
          print("allowed-license candidates:", sum(
              c["licenseAllowed"] for t in report["targets"] for c in t["candidates"]
          ))
          PY

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase4h-commons-review
          path: phase4h-commons-review
          if-no-files-found: error
          retention-days: 7
