name: Phase 4J exact-head validation

on:
  push:
    branches:
      - feat/phase-4j-ab-photography-batch
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact executable head
        uses: actions/checkout@v4
        with:
          ref: 661e2fa17d16a494caafd5e9ce2289b9526bfb0a
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Reproduce Phase 4J selector
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("data/visual/a-b-photography-batch.json").read_text())
          current=json.loads(Path("data/visual/photography-metadata.json").read_text())
          targets={p["placeId"] for p in manifest["places"]}
          baseline=[r for r in current["images"] if r["placeId"] not in targets]
          assert len(baseline)==85, len(baseline)
          current["images"]=baseline
          current["imageCount"]=85
          Path("/tmp/phase4i-baseline.json").write_text(json.dumps(current,ensure_ascii=False,indent=2)+"\n")
          PY
          python scripts/select-ab-photography-batch.py \
            --photography /tmp/phase4i-baseline.json \
            --out /tmp/phase4j-selector.json
          python - <<'PY'
          import collections, json
          from pathlib import Path
          generated=json.loads(Path("/tmp/phase4j-selector.json").read_text())
          pinned=json.loads(Path("data/visual/a-b-photography-batch.json").read_text())
          assert generated == pinned
          assert generated["trancheSize"] == 32
          assert generated["eligibleCount"] == 108
          assert generated["hubQuotas"] == {
              "Fukuoka": 1, "Kioto": 7, "Okinawa": 7, "Osaka": 8, "Tokio": 9
          }
          assert generated["distinctCategoryCount"] == 19
          places={p["id"]:p for p in json.loads(Path("data/places.json").read_text())}
          mix=collections.Counter(places[p["placeId"]]["grade"] for p in generated["places"])
          assert dict(mix) == {"A": 23, "B": 9}, dict(mix)
          print("selector fixture reproduced: 32 targets, 23 A / 9 B, 19 categories")
          PY

      - name: Photography validator
        run: python scripts/validate-photography.py

      - name: Python test suite
        run: python -m unittest discover scripts -p 'test_*.py'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Focused photography tests
        working-directory: app
        run: |
          npx vitest run \
            src/data/place-images.test.ts \
            src/lib/photography-attribution.test.ts \
            src/components/PlaceGallery.test.ts

      - name: Full Vitest
        working-directory: app
        run: npm test

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Build
        working-directory: app
        run: npm run build

      - name: Phase 4J invariants and asset budget
        run: |
          cmp data/visual/photography-metadata.json app/src/data/photography-metadata.json
          python - <<'PY'
          import collections, hashlib, json, subprocess
          from pathlib import Path

          base="abe55efc53137ece436c99f3ccfd3f706af16c8e"
          current=json.load(open("data/visual/photography-metadata.json"))
          old=json.loads(subprocess.check_output(["git","show",f"{base}:data/visual/photography-metadata.json"]))
          plan=json.load(open("data/visual/phase4j-acquisition-plan.json"))
          fixture=json.load(open("data/visual/a-b-photography-batch.json"))

          assert current["imageCount"] == 113, current["imageCount"]
          assert len(current["images"]) == 113
          assert old["imageCount"] == 85 and len(old["images"]) == 85

          old_by={r["placeId"]:r for r in old["images"]}
          cur_by={r["placeId"]:r for r in current["images"]}
          for pid,record in old_by.items():
              assert cur_by.get(pid)==record, f"pre-4J metadata drift: {pid}"

          # Prove every pre-Phase-4J image blob is byte-identical to the exact base.
          for record in old["images"]:
              rel="app/public/"+record["assetPath"]
              base_bytes=subprocess.check_output(["git","show",f"{base}:{rel}"])
              current_bytes=Path(rel).read_bytes()
              assert hashlib.sha256(base_bytes).digest() == hashlib.sha256(current_bytes).digest(), (
                  f"pre-4J asset drift: {record['placeId']}"
              )

          dup={k:v for k,v in collections.Counter(r["placeId"] for r in current["images"]).items() if v>1}
          assert not dup, dup

          allow={"CC0","CC BY 2.0","CC BY 2.5","CC BY 3.0","CC BY 4.0","CC BY-SA 2.0","CC BY-SA 2.5","CC BY-SA 3.0","CC BY-SA 4.0"}
          assert not ({r["license"] for r in current["images"]}-allow)
          assert all(r["licenseUrl"].startswith("https://creativecommons.org/") for r in current["images"])
          assert all(r["sourceUrl"].startswith("https://commons.wikimedia.org/wiki/File:") for r in current["images"])

          attempted=[r["placeId"] for r in fixture["places"]]
          accepted=[r["placeId"] for r in plan["accepted"]]
          failed=[r["placeId"] for r in plan["failedClosed"]]
          assert len(attempted)==32 and len(set(attempted))==32
          assert len(accepted)==28 and len(set(accepted))==28
          assert len(failed)==4 and len(set(failed))==4
          assert set(accepted) | set(failed) == set(attempted)
          assert set(accepted).isdisjoint(failed)

          for pid in accepted:
              assert pid in cur_by, pid
          for pid in failed:
              assert pid not in cur_by, pid

          carried=["JP-033","JP-126","JP-203","JP-204","JP-050","JP-195",
                   "JP-121","JP-156","JP-095","JP-079","JP-202"]
          assert len(carried)==11
          for pid in carried:
              assert pid not in cur_by, f"carried fail-closed re-entered: {pid}"
              assert pid not in set(attempted), f"carried fail-closed was attempted: {pid}"

          total=0
          for row in plan["accepted"]:
              path=Path("app/public")/row["assetPath"]
              assert path.is_file(), path
              total += path.stat().st_size
          mib=total/1024/1024
          print(f"Phase 4J asset delta: {total} bytes ({mib:.2f} MiB)")
          if total > 10*1024*1024:
              print("NOTICE: Phase 4J soft 10 MiB budget exceeded")
          assert total <= 14*1024*1024, total

          assert len(list(Path("app/public/images/places").glob("JP-*/*.webp"))) == 113
          print("OK: 85 prior records/assets preserved; 28 accepted; 4 fail-closed; 113 total")
          PY

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Phase 4J browser audit first pass
        working-directory: app
        run: node scripts/phase4j-browser-audit.mjs

      - name: Phase 4J browser audit second pass
        working-directory: app
        run: node scripts/phase4j-browser-audit.mjs

      - name: Phase 4H browser audit regression
        working-directory: app
        run: node scripts/phase4h-browser-audit.mjs

      - name: Phase 4F browser audit regression
        working-directory: app
        run: node scripts/phase4f-browser-audit.mjs

      - name: Phase 4D browser audit regression
        working-directory: app
        run: node scripts/phase4d-browser-audit.mjs

      - name: Phase 4C browser audit regression
        working-directory: app
        run: node scripts/phase4c-browser-audit.mjs

      - name: Whitespace gate
        run: |
          git diff --check abe55efc53137ece436c99f3ccfd3f706af16c8e...HEAD
          git diff --check
