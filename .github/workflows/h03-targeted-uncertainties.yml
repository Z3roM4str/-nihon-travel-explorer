name: H03 targeted protection ordering and ordinary Safari capability
on:
  pull_request:
    branches: [main, claude/final-audit-data-recovery-fixes-l60xs9]
    paths:
      - '.github/workflows/h03-targeted-uncertainties.yml'
      - 'app/scripts/final-audit-persistence-regressions-check.mjs'
      - 'app/scripts/webstorage-lock-order-check.mjs'
      - 'app/scripts/webstorage-safari-ordinary.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h03-targeted-uncertainties-${{ github.ref }}
  cancel-in-progress: true
jobs:
  retained-events:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Twenty-four independent strict original cases, retain every result
        run: |
          failed=0
          for iteration in $(seq 1 24); do
            mkdir -p targeted-protection/product-$iteration
            if ! NIHON_ONLY=retry-queued-retained-events-invalid NIHON_BROWSER=webkit NIHON_EVIDENCE_OUT=targeted-protection/product-$iteration node scripts/final-audit-persistence-regressions-check.mjs > targeted-protection/product-$iteration/log.txt 2>&1; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Native lock ordering, no Nihon
        if: ${{ !cancelled() }}
        env:
          NIHON_EVIDENCE_OUT: targeted-protection/native
        run: node scripts/webstorage-lock-order-check.mjs > targeted-protection/native.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-protection-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/targeted-protection/
          retention-days: 30
          if-no-files-found: error
  ordinary-safari:
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Actual ordinary Safari save reload normal quit same-profile reopen
        run: python3 scripts/webstorage-safari-ordinary.py > webstorage-safari-ordinary.log 2>&1
      - name: Read any preserved ordinary-profile SQLite images independently
        if: always()
        run: python3 scripts/inspect-h03-sqlite.py webstorage-safari-ordinary > webstorage-safari-ordinary-sqlite.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordinary-safari-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/webstorage-safari-ordinary/
            app/webstorage-safari-ordinary.log
            app/webstorage-safari-ordinary-sqlite.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
