name: Phase 3F-L temporary validation

on:
  push:
    branches:
      - feat/phase-3f-l-official-reservation-evidence-coverage-expansion-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact validated code head
        uses: actions/checkout@v4
        with:
          ref: b10e2bcf8abb9085d2e29576739b60cb40c9fb84
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate reservation mechanisms
        run: |
          python3 scripts/validate-reservation-mechanisms.py
          python3 scripts/test_reservation_mechanisms.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Focused Phase 3F tests
        working-directory: app
        run: |
          npx vitest run \
            src/lib/reservation-mechanism-evidence.test.ts \
            src/lib/reservation-mechanism-date-derivation.test.ts \
            src/lib/reservation-mechanism-presentation.test.ts \
            src/lib/reservation-mechanism-reference-date.test.ts \
            src/lib/reservation-mechanism-reference-date-presentation.test.ts \
            src/lib/reservation-mechanism-calendar.test.ts \
            src/lib/reservation-mechanism-calendar-presentation.test.ts \
            src/components/OrderedSequenceBuilder.official-reservation-reference-date.test.ts \
            src/components/OrderedSequenceBuilder.official-reservation-calendar.test.ts

      - name: Full test suite
        working-directory: app
        run: npm test

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Build
        working-directory: app
        run: npm run build

      - name: Whitespace gates
        run: |
          git diff --check 7fa8e82053f241358f8d613b2d866b241dee36ac...HEAD
          git diff --check

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Phase 3F-F browser audit
        working-directory: app
        run: node scripts/phase3f-f-browser-audit.mjs

      - name: Phase 3F-H browser audit
        working-directory: app
        run: node scripts/phase3f-h-browser-audit.mjs

      - name: Phase 3F-J browser audit
        working-directory: app
        run: node scripts/phase3f-j-browser-audit.mjs
