name: Phase 3F-Q temporary validation

on:
  push:
    branches:
      - feat/phase-3f-q-purchase-residence-context-presentation-exhaustiveness

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact validated head
        uses: actions/checkout@v4
        with:
          ref: 7575a2d9d857676a7df61af31c0e885cdb02d7c0
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Focused Phase 3F-Q test
        working-directory: app
        run: npx vitest run src/lib/reservation-mechanism-presentation.test.ts

      - name: Full test suite
        working-directory: app
        run: npm test

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Build
        working-directory: app
        run: npm run build

      - name: Whitespace gates
        run: |
          git diff --check 4a9156c4236453c7389e6841fe5d7f25ffc08ecf...HEAD
          git diff --check

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Phase 3F-F browser audit
        working-directory: app
        run: node scripts/phase3f-f-browser-audit.mjs

      - name: Phase 3F-H browser audit
        working-directory: app
        run: node scripts/phase3f-h-browser-audit.mjs

      - name: Phase 3F-J browser audit
        working-directory: app
        run: node scripts/phase3f-j-browser-audit.mjs
