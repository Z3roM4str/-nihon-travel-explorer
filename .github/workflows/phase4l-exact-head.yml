name: Phase 4L exact-head validation

on:
  push:
    branches:
      - feat/phase-4l-ab-photography-batch-ii
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact executable head
        uses: actions/checkout@v4
        with:
          ref: 7036d86af674f5394a5180014fc12811f486e6c6
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Reproduce the Phase 4K fixture and Phase 4L target set
        run: |
          python - <<'PY'
          import collections, json
          from pathlib import Path
          fixture=json.loads(Path("data/visual/phase4k-successor-fixture.json").read_text())
          ids=[p["placeId"] for p in fixture["places"]]
          expected="JP-084 JP-190 JP-149 JP-012 JP-062 JP-176 JP-122 JP-213 JP-087 JP-200 JP-112 JP-053 JP-064 JP-158 JP-113 JP-007 JP-063 JP-185 JP-130 JP-042 JP-065 JP-172 JP-139 JP-051 JP-067 JP-169 JP-114 JP-020 JP-186 JP-140 JP-052 JP-017".split()
          assert ids == expected, ids
          assert fixture["trancheSize"] == 32
          assert fixture["gradeScope"] == ["A", "B"]
          assert fixture["eligibleCount"] == 76
          assert fixture["gradeCounts"] == {"A": 25, "B": 7}
          assert fixture["distinctCategoryCount"] == 13
          assert fixture["hubQuotas"] == {"Kioto": 7, "Okinawa": 8, "Osaka": 8, "Tokio": 9}
          assert [p["placeId"] for p in fixture["places"] if p["temporalRisk"]] == ["JP-213"]
          places={p["id"]:p for p in json.loads(Path("data/places.json").read_text())}
          assert not {places[i]["grade"] for i in ids} & {"C","D","S"}
          print("Phase 4K fixture reproduced: 32 targets, 25 A / 7 B, 13 categories")
          PY

      - name: Photography validator
        run: python scripts/validate-photography.py

      - name: Python test suite
        run: python -m unittest discover scripts -p 'test_*.py'

      - name: Historical selector and baseline regressions
        run: |
          python -m unittest \
            scripts.test_a_grade_photography_selector \
            scripts.test_a_grade_photography_selector_ii \
            scripts.test_ab_photography_selector \
            scripts.test_phase4k_coverage_strategy
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          def load(name, path):
              spec=importlib.util.spec_from_file_location(name, path)
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod
          base=load("b","scripts/photography_baseline.py")
          base.assert_batch_registry_is_complete()
          s4e=load("s4e","scripts/select-a-grade-photography-batch.py")
          p,b=base.load_historical_baseline("phase4e"); assert len(b)==36
          assert s4e.select_batch(p,b)==json.loads(Path("data/visual/a-grade-photography-batch-i.json").read_text())
          s4g=load("s4g","scripts/select-a-grade-photography-batch-ii.py")
          p,b=base.load_historical_baseline("phase4g"); assert len(b)==58
          assert s4g.select_batch(p,b)==json.loads(Path("data/visual/a-grade-photography-batch-ii.json").read_text())
          s4j=load("s4j","scripts/select-ab-photography-batch.py")
          places,images=base.load_current_inputs()
          assert s4j.select_batch(places,images[:85])==json.loads(Path("data/visual/a-b-photography-batch.json").read_text())
          a4k=load("a4k","scripts/analyze-phase4k-coverage-strategy.py")
          p,b=base.load_historical_baseline("phase4k"); assert len(b)==113
          assert a4k.select_batch(p,b,a4k.RECOMMENDED_SCOPE,a4k.RECOMMENDED_TRANCHE_SIZE)==json.loads(Path("data/visual/phase4k-successor-fixture.json").read_text())
          print("historical fixtures reproduce exactly: 4E/36, 4G/58, 4J/85, 4K/113")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Focused photography tests
        working-directory: app
        run: |
          npx vitest run \
            src/data/place-images.test.ts \
            src/lib/photography-attribution.test.ts \
            src/components/PlaceGallery.test.ts

      - name: Full Vitest
        working-directory: app
        run: npm test

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Build
        working-directory: app
        run: npm run build

      - name: Phase 4L invariants and asset budget
        run: |
          cmp data/visual/photography-metadata.json app/src/data/photography-metadata.json
          python - <<'PY'
          import collections, hashlib, json, subprocess
          from pathlib import Path

          base="524531a1d9f41c84bc8ca53bfde5dc4ee5febd6d"
          current=json.load(open("data/visual/photography-metadata.json"))
          old=json.loads(subprocess.check_output(["git","show",f"{base}:data/visual/photography-metadata.json"]))
          plan=json.load(open("data/visual/phase4l-acquisition-plan.json"))
          fixture=json.load(open("data/visual/phase4k-successor-fixture.json"))

          assert current["imageCount"] == 144 and len(current["images"]) == 144
          assert old["imageCount"] == 113 and len(old["images"]) == 113

          old_by={r["placeId"]:r for r in old["images"]}
          cur_by={r["placeId"]:r for r in current["images"]}
          for pid,record in old_by.items():
              assert cur_by.get(pid)==record, f"pre-4L metadata drift: {pid}"
          for record in old["images"]:
              rel="app/public/"+record["assetPath"]
              base_bytes=subprocess.check_output(["git","show",f"{base}:{rel}"])
              assert hashlib.sha256(base_bytes).digest() == hashlib.sha256(Path(rel).read_bytes()).digest(), (
                  f"pre-4L asset drift: {record['placeId']}")

          dup={k:v for k,v in collections.Counter(r["placeId"] for r in current["images"]).items() if v>1}
          assert not dup, dup
          for key in ("sourceUrl","acquisitionUrl","assetPath"):
              d={k:v for k,v in collections.Counter(r[key] for r in current["images"]).items() if v>1}
              assert not d, (key, d)

          allow={"CC0","CC BY 2.0","CC BY 2.5","CC BY 3.0","CC BY 4.0","CC BY-SA 2.0","CC BY-SA 2.5","CC BY-SA 3.0","CC BY-SA 4.0"}
          assert not ({r["license"] for r in current["images"]}-allow)
          assert all(r["licenseUrl"].startswith("https://creativecommons.org/") for r in current["images"])
          assert all(r["sourceUrl"].startswith("https://commons.wikimedia.org/wiki/File:") for r in current["images"])
          assert all(r["source"]=="Wikimedia Commons" for r in current["images"])
          assert all("?" not in r["acquisitionUrl"] for r in current["images"])

          attempted=[p["placeId"] for p in fixture["places"]]
          accepted=[r["placeId"] for r in plan["accepted"]]
          failed=[r["placeId"] for r in plan["failedClosed"]]
          assert len(attempted)==32 and len(accepted)==31 and len(failed)==1
          assert set(accepted)|set(failed)==set(attempted)
          assert set(accepted).isdisjoint(failed)
          for pid in accepted: assert pid in cur_by, pid
          for pid in failed: assert pid not in cur_by, pid

          carried=["JP-033","JP-126","JP-203","JP-204","JP-050","JP-195",
                   "JP-121","JP-156","JP-095","JP-079","JP-202",
                   "JP-120","JP-211","JP-041","JP-168"]
          assert len(carried)==15
          for pid in carried:
              assert pid not in cur_by, f"carried fail-closed re-entered: {pid}"
              assert pid not in set(attempted), f"carried fail-closed attempted: {pid}"

          total=sum((Path("app/public")/row["assetPath"]).stat().st_size for row in plan["accepted"])
          mib=total/1024/1024
          print(f"Phase 4L asset delta: {total} bytes ({mib:.2f} MiB)")
          if total > 11*1024*1024:
              print("NOTICE: Phase 4L soft 11 MiB budget crossed")
          assert total <= 14*1024*1024, total

          assert len(list(Path("app/public/images/places").glob("JP-*/*.webp"))) == 144
          print("OK: 113 prior records/assets preserved; 31 accepted; 1 fail-closed; 144 total")
          PY

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Phase 4L browser audit first pass
        working-directory: app
        run: node scripts/phase4l-browser-audit.mjs

      - name: Phase 4L browser audit second pass
        working-directory: app
        run: node scripts/phase4l-browser-audit.mjs

      - name: Phase 4J browser audit regression
        working-directory: app
        run: node scripts/phase4j-browser-audit.mjs

      - name: Phase 4H browser audit regression
        working-directory: app
        run: node scripts/phase4h-browser-audit.mjs

      - name: Phase 4F browser audit regression
        working-directory: app
        run: node scripts/phase4f-browser-audit.mjs

      - name: Phase 4D browser audit regression
        working-directory: app
        run: node scripts/phase4d-browser-audit.mjs

      - name: Phase 4C browser audit regression
        working-directory: app
        run: node scripts/phase4c-browser-audit.mjs

      - name: Whitespace gate
        run: |
          git diff --check 524531a1d9f41c84bc8ca53bfde5dc4ee5febd6d...HEAD
          git diff --check
