name: Phase 4H exact-head validation

on:
  push:
    branches:
      - feat/phase-4h-a-grade-photography-batch-ii
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact executable head
        uses: actions/checkout@v4
        with:
          ref: cda32ceb61372fc7f0599b59ce28261b4b196a4e
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Reproduce Phase 4G selector
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("data/visual/a-grade-photography-batch-ii.json").read_text())
          current=json.loads(Path("data/visual/photography-metadata.json").read_text())
          targets={p["placeId"] for p in manifest["places"]}
          baseline=[r for r in current["images"] if r["placeId"] not in targets]
          assert len(baseline)==58, len(baseline)
          current["images"]=baseline
          current["imageCount"]=58
          Path("/tmp/phase4g-baseline.json").write_text(json.dumps(current,ensure_ascii=False,indent=2)+"\n")
          PY
          python scripts/select-a-grade-photography-batch-ii.py \
            --photography /tmp/phase4g-baseline.json \
            --out /tmp/phase4h-selector.json
          python - <<'PY'
          import json
          from pathlib import Path
          generated=json.loads(Path("/tmp/phase4h-selector.json").read_text())
          pinned=json.loads(Path("data/visual/a-grade-photography-batch-ii.json").read_text())
          assert generated == pinned
          assert generated["trancheSize"] == 32
          assert generated["eligibleCount"] == 115
          assert generated["hubQuotas"] == {
              "Kioto": 8, "Okinawa": 8, "Osaka": 7, "Sapporo": 1, "Tokio": 8
          }
          assert generated["distinctCategoryCount"] == 19
          print("selector fixture reproduced")
          PY

      - name: Photography validator
        run: python scripts/validate-photography.py

      - name: Python test suite
        run: python -m unittest discover scripts -p 'test_*.py'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Focused photography tests
        working-directory: app
        run: |
          npx vitest run \
            src/data/place-images.test.ts \
            src/lib/photography-attribution.test.ts \
            src/components/PlaceGallery.test.ts

      - name: Full Vitest
        working-directory: app
        run: npm test

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Build
        working-directory: app
        run: npm run build

      - name: Phase 4H invariants and asset budget
        run: |
          cmp data/visual/photography-metadata.json app/src/data/photography-metadata.json
          python - <<'PY'
          import collections, hashlib, json, subprocess
          from pathlib import Path

          base="589d64a87d1963622fdf64c07be31460f145f79c"
          current=json.load(open("data/visual/photography-metadata.json"))
          old=json.loads(subprocess.check_output(["git","show",f"{base}:data/visual/photography-metadata.json"]))
          plan=json.load(open("data/visual/phase4h-acquisition-plan.json"))
          fixture=json.load(open("data/visual/a-grade-photography-batch-ii.json"))

          assert current["imageCount"] == 85, current["imageCount"]
          assert len(current["images"]) == 85
          assert old["imageCount"] == 58 and len(old["images"]) == 58

          old_by={r["placeId"]:r for r in old["images"]}
          cur_by={r["placeId"]:r for r in current["images"]}
          for pid,record in old_by.items():
              assert cur_by.get(pid)==record, f"pre-4H metadata drift: {pid}"

          # Prove every pre-Phase-4H image blob is byte-identical to the exact base.
          for record in old["images"]:
              rel="app/public/"+record["assetPath"]
              base_bytes=subprocess.check_output(["git","show",f"{base}:{rel}"])
              current_bytes=Path(rel).read_bytes()
              assert hashlib.sha256(base_bytes).digest() == hashlib.sha256(current_bytes).digest(), (
                  f"pre-4H asset drift: {record['placeId']}"
              )

          dup={k:v for k,v in collections.Counter(r["placeId"] for r in current["images"]).items() if v>1}
          assert not dup, dup

          allow={"CC0","CC BY 2.0","CC BY 2.5","CC BY 3.0","CC BY 4.0","CC BY-SA 2.0","CC BY-SA 2.5","CC BY-SA 3.0","CC BY-SA 4.0"}
          assert not ({r["license"] for r in current["images"]}-allow)

          attempted=[r["placeId"] for r in fixture["places"]]
          accepted=[r["placeId"] for r in plan["accepted"]]
          failed=[r["placeId"] for r in plan["failedClosed"]]
          assert len(attempted)==32 and len(set(attempted))==32
          assert len(accepted)==27 and len(set(accepted))==27
          assert len(failed)==5 and len(set(failed))==5
          assert set(accepted) | set(failed) == set(attempted)
          assert set(accepted).isdisjoint(failed)

          for pid in accepted:
              assert pid in cur_by, pid
          for pid in failed:
              assert pid not in cur_by, pid

          total=0
          for row in plan["accepted"]:
              path=Path("app/public")/row["assetPath"]
              assert path.is_file(), path
              total += path.stat().st_size
          mib=total/1024/1024
          print(f"Phase 4H asset delta: {total} bytes ({mib:.2f} MiB)")
          if total > 10*1024*1024:
              print("NOTICE: Phase 4H soft 10 MiB budget exceeded")
          assert total <= 14*1024*1024, total

          assert len(list(Path("app/public/images/places").glob("JP-*/*.webp"))) == 85
          print("OK: 58 prior records/assets preserved; 27 accepted; 5 fail-closed; 85 total")
          PY

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Phase 4H browser audit first pass
        working-directory: app
        run: node scripts/phase4h-browser-audit.mjs

      - name: Phase 4H browser audit second pass
        working-directory: app
        run: node scripts/phase4h-browser-audit.mjs

      - name: Phase 4F browser audit regression
        working-directory: app
        run: node scripts/phase4f-browser-audit.mjs

      - name: Phase 4C browser audit regression
        working-directory: app
        run: node scripts/phase4c-browser-audit.mjs

      - name: Whitespace gate
        run: |
          git diff --check 589d64a87d1963622fdf64c07be31460f145f79c...HEAD
          git diff --check
