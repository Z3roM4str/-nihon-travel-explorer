name: Phase 4C exact-head validation

on:
  push:
    branches:
      - feat/phase-4c-photography-attribution-corrective

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Photography validator
        run: python scripts/validate-photography.py

      - name: Python test suite
        run: python -m unittest discover scripts -p 'test_*.py'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Full Vitest
        working-directory: app
        run: npm test

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Build
        working-directory: app
        run: npm run build

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Phase 4C browser audit first pass
        working-directory: app
        run: node scripts/phase4c-browser-audit.mjs

      - name: Phase 4C browser audit second pass
        working-directory: app
        run: node scripts/phase4c-browser-audit.mjs

      - name: Whitespace gate
        run: git diff --check origin/main...HEAD
