name: Web Storage normal shutdown versus abrupt death
on:
  pull_request:
    branches: [main, claude/final-audit-data-recovery-fixes-l60xs9]
    paths:
      - ".github/workflows/webstorage-durability.yml"
      - "app/scripts/webstorage-durability*"
      - "app/scripts/webstorage-safari-capability.py"
      - "app/src/**"
      - "app/package-lock.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webstorage-durability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safari-capability:
    name: Actual Safari capability and native reload only
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: python3 scripts/webstorage-safari-capability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webstorage-safari-capability-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/webstorage-safari-capability.json
            app/webstorage-safaridriver.log
            app/webstorage-safari-evidence/
          retention-days: 30
          if-no-files-found: error
  compare:
    name: ${{ matrix.os }} ${{ matrix.browser }} normal and abrupt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: webkit
          - os: macos-15
            browser: webkit
          - os: ubuntu-24.04
            browser: chromium
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - if: runner.os == 'macOS'
        run: npx playwright install ${{ matrix.browser }}
      - run: npm run build
      - name: Native A then B and ordinary Nihon save reload close reopen
        env:
          NIHON_BROWSER: ${{ matrix.browser }}
          NIHON_DURABILITY_REPETITIONS: "3"
          NIHON_EVIDENCE_OUT: webstorage-durability
          DEBUG: pw:browser
        run: node scripts/webstorage-durability-check.mjs > webstorage-durability.log 2>&1
      - name: Independent SQLite reading of every preserved profile
        if: always()
        run: python3 scripts/inspect-h03-sqlite.py webstorage-durability ${{ matrix.browser == 'webkit' && '--require-localstorage' || '' }} > webstorage-independent-sqlite.json
      - name: Separate downloadable results and raw observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webstorage-metadata-${{ matrix.os }}-${{ matrix.browser }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/webstorage-durability/results.json
            app/webstorage-durability.log
            app/webstorage-independent-sqlite.json
          retention-days: 30
          if-no-files-found: error
      - name: Preserve original synthetic profiles including every failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webstorage-profiles-${{ matrix.os }}-${{ matrix.browser }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/webstorage-durability/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
