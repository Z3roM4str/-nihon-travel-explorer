name: Phase 4D exact-head validation

on:
  push:
    branches:
      - feat/phase-4d-s-grade-photography-batch

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact validated head
        uses: actions/checkout@v4
        with:
          ref: 52e001b1536d55f6f8ff6e1259a166e92fed582b
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Photography validator
        run: python scripts/validate-photography.py

      - name: Python test suite
        run: python -m unittest discover scripts -p 'test_*.py'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Focused photography tests
        working-directory: app
        run: |
          npx vitest run \
            src/data/place-images.test.ts \
            src/lib/photography-attribution.test.ts \
            src/components/PlaceGallery.test.ts

      - name: Full Vitest
        working-directory: app
        run: npm test

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Build
        working-directory: app
        run: npm run build

      - name: Batch invariants
        run: |
          # The twenty-four pre-existing blobs must be untouched.
          changed=$(git diff --name-only 440f814439360e2c5e7423cd243546e415e1a591 HEAD -- 'app/public/images/**' \
            | grep -vE 'JP-044|JP-066|JP-096|JP-135|JP-142|JP-143|JP-144|JP-184|JP-188|JP-192|JP-197|JP-205' | wc -l)
          echo "pre-existing image paths changed: $changed"
          test "$changed" -eq 0
          test "$(find app/public/images -name '*.webp' | wc -l)" -eq 36
          cmp data/visual/photography-metadata.json app/src/data/photography-metadata.json
          python - <<'PY'
          import json, collections
          imgs = json.load(open("data/visual/photography-metadata.json"))["images"]
          assert len(imgs) == 36, len(imgs)
          dup = {k: v for k, v in collections.Counter(r["placeId"] for r in imgs).items() if v > 1}
          assert not dup, dup
          allow = {"CC0","CC BY 2.0","CC BY 2.5","CC BY 3.0","CC BY 4.0",
                   "CC BY-SA 2.0","CC BY-SA 2.5","CC BY-SA 3.0","CC BY-SA 4.0"}
          assert not ({r["license"] for r in imgs} - allow)
          for deferred in ("JP-033", "JP-126", "JP-203", "JP-204"):
              assert all(r["placeId"] != deferred for r in imgs), deferred
          print("batch invariants OK")
          PY

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Phase 4D browser audit first pass
        working-directory: app
        run: node scripts/phase4d-browser-audit.mjs

      - name: Phase 4D browser audit second pass
        working-directory: app
        run: node scripts/phase4d-browser-audit.mjs

      - name: Phase 4C browser audit (regression)
        working-directory: app
        run: node scripts/phase4c-browser-audit.mjs

      - name: Whitespace gate
        run: |
          git diff --check 440f814439360e2c5e7423cd243546e415e1a591...HEAD
          git diff --check
