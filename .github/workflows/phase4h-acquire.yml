name: Phase 4H acquisition

on:
  push:
    branches:
      - feat/phase-4h-a-grade-photography-batch-ii
    paths:
      - .github/workflows/phase4h-acquire.yml

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout triggering acquisition head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact triggering checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 589d64a87d1963622fdf64c07be31460f145f79c HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install acquisition dependency
        run: python -m pip install -r scripts/requirements.txt

      - name: Reproduce selector and reviewed plan
        run: |
          python scripts/select-a-grade-photography-batch-ii.py --out /tmp/phase4h-selector.json
          cmp /tmp/phase4h-selector.json data/visual/a-grade-photography-batch-ii.json
          python scripts/test_a_grade_photography_selector_ii.py
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path("data/visual/phase4h-acquisition-plan.json").read_text())
          fixture=json.loads(Path("data/visual/a-grade-photography-batch-ii.json").read_text())
          attempted=[r["placeId"] for r in fixture["places"]]
          accepted=[r["placeId"] for r in plan["accepted"]]
          failed=[r["placeId"] for r in plan["failedClosed"]]
          assert plan["attemptedTargetCount"] == 32
          assert plan["acceptedCount"] == 27
          assert len(accepted) == 27 and len(set(accepted)) == 27
          assert len(failed) == 5 and len(set(failed)) == 5
          assert set(accepted) | set(failed) == set(attempted)
          assert set(accepted).isdisjoint(failed)
          print("OK: exact 32 = 27 accepted + 5 fail-closed")
          PY

      - name: Snapshot pre-Phase-4H assets and metadata
        run: |
          test "$(find app/public/images/places -type f -name '*.webp' | wc -l)" -eq 58
          find app/public/images/places -type f -name '*.webp' -print0             | sort -z | xargs -0 sha256sum > /tmp/phase4h-baseline-assets.sha256
          cp data/visual/photography-metadata.json /tmp/phase4h-baseline-metadata.json

      - name: Recheck Commons sources and prepare metadata
        run: |
          python scripts/prepare-phase4h-photography-metadata.py
          cmp data/visual/photography-metadata.json app/src/data/photography-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path("/tmp/phase4h-baseline-metadata.json").read_text())
          after=json.loads(Path("data/visual/photography-metadata.json").read_text())
          assert before["imageCount"] == 58 and len(before["images"]) == 58
          assert after["imageCount"] == 85 and len(after["images"]) == 85
          assert after["images"][:58] == before["images"]
          print("OK: all 58 pre-Phase-4H metadata records preserved exactly")
          PY

      - name: Acquire 27 reviewed Phase 4H assets
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/phase4h-accepted-ids.txt
          import json
          from pathlib import Path
          plan=json.loads(Path("data/visual/phase4h-acquisition-plan.json").read_text())
          for row in plan["accepted"]:
              print(row["placeId"])
          PY
          while IFS= read -r id; do
            python scripts/acquire-photography.py --only "$id"
          done < /tmp/phase4h-accepted-ids.txt

      - name: Validate acquired tree and asset budget
        run: |
          python scripts/validate-photography.py
          python scripts/test_photography.py
          python scripts/test_a_grade_photography_selector_ii.py
          cmp data/visual/photography-metadata.json app/src/data/photography-metadata.json
          test "$(find app/public/images/places -type f -name '*.webp' | wc -l)" -eq 85
          sha256sum -c /tmp/phase4h-baseline-assets.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path("data/visual/phase4h-acquisition-plan.json").read_text())
          paths=[Path("app/public") / row["assetPath"] for row in plan["accepted"]]
          missing=[str(p) for p in paths if not p.is_file()]
          if missing:
              raise SystemExit(f"missing acquired assets: {missing}")
          total=sum(p.stat().st_size for p in paths)
          mib=total/1024/1024
          print(f"Phase 4H asset delta: {total} bytes ({mib:.2f} MiB)")
          if total > 14 * 1024 * 1024:
              raise SystemExit("Phase 4H hard 14 MiB review threshold exceeded")
          if total > 10 * 1024 * 1024:
              print("NOTICE: Phase 4H soft 10 MiB budget exceeded; hard threshold not exceeded")
          PY

      - name: Commit exact acquired state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             data/visual/photography-metadata.json             app/src/data/photography-metadata.json             app/public/images/places
          test -n "$(git status --porcelain)"
          git commit -m "phase4h: acquire 27 licensed photography assets"
          echo "ACQUIRED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Revalidate exact asset commit
        run: |
          test "$(git rev-parse HEAD)" = "$ACQUIRED_SHA"
          python scripts/validate-photography.py
          python scripts/test_photography.py
          python scripts/test_a_grade_photography_selector_ii.py
          cmp data/visual/photography-metadata.json app/src/data/photography-metadata.json
          sha256sum -c /tmp/phase4h-baseline-assets.sha256
          test -z "$(git status --porcelain --untracked-files=all)" || {
            git status --short
            exit 1
          }

      - name: Push exact acquired commit
        run: git push origin HEAD:feat/phase-4h-a-grade-photography-batch-ii
