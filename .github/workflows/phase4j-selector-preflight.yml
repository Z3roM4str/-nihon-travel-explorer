name: Phase 4J selector preflight

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selector-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce exact Phase 4J fixture
        run: |
          python scripts/test_ab_photography_selector.py
          python scripts/select-ab-photography-batch.py --out /tmp/a-b-photography-batch.json
          cmp /tmp/a-b-photography-batch.json data/visual/a-b-photography-batch.json
